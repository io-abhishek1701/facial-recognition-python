<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFace AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>QuickFace AI</h1>

        <div class="card">

            <h2>Enroll Person</h2>

            <input
                type="text"
                id="name"
                placeholder="Enter Name"
            >

            <input
                type="file"
                id="enrollImage"
            >

            <button onclick="enrollPerson()">
                Enroll
            </button>

        </div>

        <div class="card">

            <h2>Recognize Person</h2>

            <input
                type="file"
                id="recognizeImage"
            >

            <button onclick="recognizePerson()">
                Recognize
            </button>

        </div>

        <div id="result"></div>

    </div>

<script src="script.js"></script>

</body>
</html>
